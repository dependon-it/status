# Runs in the PUBLIC status repo (pushed by ops/status-page/push.sh). IT-1353.
# Keeps the nightly sleep and any full hibernation shown as planned maintenance.
# Not one of the eight workflow files Upptime rewrites, so the daily template update keeps it.
name: Planned downtime

on:
  schedule:
    # GitHub runs schedules late, so one run is not enough. 06:00, 12:00 and 18:00 UTC.
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'ensure (re-date the nightly window), open, extend or close (a full hibernation)'
        required: true
        default: ensure
        type: choice
        options: [ensure, open, extend, close]
      from:
        description: 'open: start, UTC, for example 2026-10-14T18:00:00Z'
        required: false
        type: string
      to:
        description: 'open or extend: end, UTC'
        required: false
        type: string
      reason:
        description: 'open: one plain sentence for readers'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: planned-downtime
  cancel-in-progress: false

jobs:
  planned-downtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the one dependency
        run: npm install --no-save --no-package-lock js-yaml@4
      - name: Update the maintenance issues and planned-downtime.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ACTION: ${{ inputs.action || 'ensure' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REASON: ${{ inputs.reason }}
        run: |
          args=("$ACTION" --yes)
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$TO" ] && args+=(--to "$TO")
          [ -n "$REASON" ] && args+=(--reason "$REASON")
          node scripts/planned-downtime.mjs "${args[@]}"
      - name: Commit planned-downtime.json
        run: |
          git config user.name "status-page[bot]"
          git config user.email "status-page-bot@users.noreply.github.com"
          git add planned-downtime.json
          git diff --cached --quiet || { git commit -m "chore: update planned downtime [skip ci]" && git push; }
